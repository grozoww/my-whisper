name: Release

# Tag-triggered and restricted to the main repository. A fork — including a fork's pull request —
# can never reach the signing certificate or the notarization credentials below.
on:
  push:
    tags: ['v*']
    # Every push to main refreshes a single rolling prerelease tagged `latest`, so there is always
    # a DMG to download and `scripts/install.sh` has something to find without anyone cutting a
    # tag. Versioned releases still come from tags, and this never overwrites one: the rolling
    # build has a tag of its own and is marked prerelease, so GitHub keeps showing the newest real
    # release as the latest.
    branches: [main]
  # Lets you produce a downloadable build before you have an Apple Developer account, and lets you
  # rehearse the whole thing without cutting a tag.
  workflow_dispatch:
    inputs:
      unsigned:
        description: 'Build without signing or notarizing (no Apple Developer account needed)'
        type: boolean
        default: false

# A second push to main while the first is still packaging would race to move the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  ROLLING_TAG: latest

jobs:
  release:
    name: Package and publish
    runs-on: macos-latest
    if: github.repository == 'grozoww/my-whisper'

    steps:
      - uses: actions/checkout@v4

      # Secrets are not available in a job-level `if:`, so which path to take is worked out here
      # and read from `env` by the steps below.
      #
      # Required repository secrets for the notarized path:
      #   MACOS_CERTIFICATE          base64 of the Developer ID Application .p12
      #   MACOS_CERTIFICATE_PASSWORD password for that .p12
      #   MACOS_SIGNING_IDENTITY     e.g. "Developer ID Application: Name (TEAMID)"
      #   APPLE_TEAM_ID              10-character team id
      #   NOTARY_APPLE_ID            Apple ID used for notarization
      #   NOTARY_PASSWORD            app-specific password for that Apple ID
      - name: Decide signing path
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          FORCED_UNSIGNED: ${{ inputs.unsigned }}
        run: |
          if [ "$FORCED_UNSIGNED" = "true" ] || [ -z "$MACOS_CERTIFICATE" ] || [ -z "$NOTARY_PASSWORD" ]; then
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "Building unsigned — downloads will need right-click → Open on first launch."
          else
            echo "SIGNED=true" >> "$GITHUB_ENV"
          fi

      - name: Import signing certificate
        if: env.SIGNED == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f /tmp/cert.p12

      - name: Build, sign, notarize, staple
        if: env.SIGNED == 'true'
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: ./scripts/package.sh

      - name: Build unsigned
        if: env.SIGNED == 'false'
        run: ./scripts/package.sh --unsigned

      # An unsigned download that refuses to open, with no explanation, reads as broken software.
      # package.sh writes the wording; this puts it where the person downloading will see it.
      - name: Assemble release notes
        run: |
          : > release-notes.md
          if [ "${{ github.ref_type }}" != "tag" ]; then
            cat >> release-notes.md <<'ROLLING'
          > **Rolling build.** Rebuilt from `main` on every push, so this tag moves and its
          > contents change. For something that stays put, use a versioned release.

          ROLLING
          fi
          if [ -f dist/INSTALL.md ]; then
            cat dist/INSTALL.md >> release-notes.md
            printf '\n---\n\n' >> release-notes.md
          fi

      # The rolling tag is reused, so last push's DMG is still attached to it. Assets are matched
      # by filename and the filename carries the version, so a version bump would otherwise leave
      # two DMGs on one release and install.sh could pick either. Deleting the release outright is
      # the only way to be sure exactly one build is attached.
      - name: Clear the previous rolling build
        # Pushes to main only. A manual run publishes to a build-<n> tag of its own, and must not
        # take the rolling release down with it.
        if: github.event_name == 'push' && github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$ROLLING_TAG" --yes --cleanup-tag || true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          # SHA256SUMS is what scripts/install.sh checks the download against.
          files: |
            dist/*.dmg
            dist/SHA256SUMS
          body_path: release-notes.md
          generate_release_notes: true
          # A tag push keeps its own tag. A push to main reuses one rolling tag, so main builds
          # stay a single release rather than accumulating one per commit. workflow_dispatch gets a
          # run number, so a rehearsal collides with neither.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || (github.event_name == 'push' && env.ROLLING_TAG || format('build-{0}', github.run_number)) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || (github.event_name == 'push' && format('Rolling build ({0})', github.run_number) || format('build-{0}', github.run_number)) }}
          target_commitish: ${{ github.sha }}
          # Anything that is not a notarized tag is a prerelease, so GitHub keeps pointing people
          # at the newest real release rather than at whatever main happens to contain today.
          prerelease: ${{ env.SIGNED == 'false' || github.ref_type != 'tag' }}
          make_latest: ${{ github.ref_type == 'tag' && env.SIGNED == 'true' }}

      - name: Clean up keychain
        if: always() && env.SIGNED == 'true'
        run: security delete-keychain build.keychain || true
